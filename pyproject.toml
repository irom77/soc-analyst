[project]
name = "asp-case-analyzer"
version = "0.1.0"
description = "Standalone LLM-assisted security case analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Direct: `enrichment._validate` imports it to punycode internationalized domains
    # under UTS #46 nontransitional. Already present transitively via httpx/requests,
    # but this package imports it, so it is declared. The built-in `"idna"` codec is
    # IDNA 2003 and its transitional mapping can encode to a *different* domain
    # (`faß.de` -> `fass.de`), which would enrich the wrong name.
    "idna>=3.7",
    "litellm>=1.97.0",
    # Direct: LiteLLM subclasses openai's exception types rather than a base of its
    # own, so `openai.OpenAIError` is the only working catch-all. Range matches
    # LiteLLM's own pin.
    "openai>=2.20.0,<3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
]

[project.scripts]
case-analyzer = "case_analyzer.cli:main"
explain-case-analysis = "case_analyzer.explain_cli:main"
explain_case_analysis = "case_analyzer.explain_cli:main"
case-analyzer-evals = "case_analyzer.evals:main"

[dependency-groups]
# The test suite uses the standard library `unittest` runner; ruff is the linter.
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned so the result does not depend on a developer's global ruff configuration.
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"src/case_analyzer/prompts/investigation.md" = "case_analyzer/prompts/investigation.md"
"src/case_analyzer/prompts/summary.md" = "case_analyzer/prompts/summary.md"
