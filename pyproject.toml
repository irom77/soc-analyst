[project]
name = "asp-case-analyzer"
version = "0.1.0"
description = "Standalone LLM-assisted security case analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langchain-openai>=1.3.3", "pydantic>=2.13.4", "python-dotenv>=1.1.0"]

[project.scripts]
case-analyzer = "case_analyzer.cli:main"
explain-case-analysis = "case_analyzer.explain_cli:main"
explain_case_analysis = "case_analyzer.explain_cli:main"

[dependency-groups]
# The test suite uses the standard library `unittest` runner; ruff is the linter.
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned so the result does not depend on a developer's global ruff configuration.
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"src/case_analyzer/prompts/investigation.md" = "case_analyzer/prompts/investigation.md"
